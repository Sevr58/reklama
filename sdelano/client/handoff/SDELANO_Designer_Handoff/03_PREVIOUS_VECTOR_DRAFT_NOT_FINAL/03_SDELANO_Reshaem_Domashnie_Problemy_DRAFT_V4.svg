<title>СДЕЛАНО — РЕШАЕМ ДОМАШНИЕ ПРОБЛЕМЫ!</title>
<desc>Геометрическая реконструкция надписи: буквы С Д Е Л А Н и символ О построены вручную из линейных сегментов и кривых Безье, текст подстрочника — очищенная трассировка утверждённого эталона. Действительные файлы Russo One и DM Sans в кривые не конвертировались.</desc>
